[project]
name = "mcctl"
version = "3.0.0"
description = "Run and manage Minecraft servers on your own machine: a CLI and a terminal dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S-k404" }]
keywords = ["minecraft", "server", "fabric", "paper", "modrinth", "tmux", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27,<0.28",
    "rich>=15,<16",
    "textual>=8.2,<9",
    "psutil>=7.2,<8",
]

[project.urls]
Homepage = "https://github.com/S-k404/mc-server-manager"
Issues = "https://github.com/S-k404/mc-server-manager/issues"
Changelog = "https://github.com/S-k404/mc-server-manager/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-rerunfailures>=16",
    "pytest-timeout>=2.4",
    "ruff>=0.15,<0.16",
]

[tool.uv]
package = false                      # an application you run from its folder (./install.sh), not a library to install

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300                         # a hung test fails with its name and stack instead of stalling the run

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) minus three style rules this code base follows on purpose:
ignore = [
    "E701",    # one-line helpers: `def ok(msg): _reporter.ok(msg)`
    "E702",
    "E731",    # a small lambda bound to a local name, used as a closure
]
